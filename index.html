<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獨角仙成長紀錄表 🪲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Zen Maru Gothic / Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forestBg: '#CDE8DC',
                        cardBg: '#FFFBF2',
                        inputBg: '#FFFFFF',
                        borderGreen: '#8EB89B',
                        forestDark: '#3A5A40',
                        accentYellow: '#FFE17B',
                        accentYellowHover: '#FAD052',
                        accentBlue: '#D4EBF8',
                        accentBlueHover: '#B5DCF5',
                        accentOrange: '#FFD8A8',
                        accentRed: '#FFB2B2',
                        accentRedHover: '#FA9898',
                        tagEgg: '#FFE5A3',
                        tagLarva: '#D2F0C4',
                        tagPupa: '#E3D5CA',
                        tagAdult: '#CBD8F6',
                    },
                    fontFamily: {
                        cute: ['Fredoka', 'Noto Sans TC', 'sans-serif'],
                    },
                    boxShadow: {
                        cute: '0 8px 0px 0px rgba(74, 93, 78, 0.15)',
                        cuteSm: '0 4px 0px 0px rgba(74, 93, 78, 0.12)',
                        cuteInner: 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #CDE8DC;
            background-image: radial-gradient(#B8DFC8 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #E8F4EC;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #9EC0A7;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7DA487;
        }

        .stage-btn.active {
            border-color: #4A6B53 !important;
            background-color: #FFE79A !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 0px 0px rgba(74, 93, 78, 0.2);
        }
    </style>
</head>
<body class="min-h-screen pb-12 text-gray-800">

    <div class="max-w-3xl mx-auto px-4 pt-6">
        
        <!-- Header Section -->
        <header class="text-center my-6 relative">
            <div class="inline-flex items-center justify-center gap-3 bg-cardBg px-6 py-3 rounded-full border-4 border-forestDark shadow-cute">
                <span class="text-3xl">🪲</span>
                <h1 class="text-2xl md:text-3xl font-black text-forestDark tracking-wide">獨角仙成長紀錄表</h1>
                <span class="text-3xl">🍃</span>
            </div>
            <p class="text-xs md:text-sm font-bold text-forestDark/80 mt-2">陪伴小獨角仙快樂長大的愛心日誌 ✨</p>
        </header>

        <!-- Main Input Form Card -->
        <main class="bg-cardBg rounded-3xl border-4 border-forestDark p-5 md:p-7 shadow-cute mb-8 transition-all">
            <div class="flex items-center justify-between border-b-2 border-dashed border-forestDark/20 pb-3 mb-5">
                <h2 id="formTitle" class="text-lg md:text-xl font-bold text-forestDark flex items-center gap-2">
                    <span class="text-2xl">🌱</span> 新增成長紀錄
                </h2>
                <span id="editBadge" class="hidden bg-accentOrange text-forestDark text-xs font-bold px-3 py-1 rounded-full border-2 border-forestDark animate-pulse">
                    ✏️ 編輯模式中
                </span>
            </div>

            <form id="growthForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editIndex" value="-1">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- ID / Name -->
                    <div>
                        <label for="beetleId" class="block text-sm font-bold text-forestDark mb-1">
                            編號 / 名稱 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="beetleId" required placeholder="例如：RH-01 或 獨角將軍" 
                            class="w-full bg-inputBg border-2 border-forestDark/40 focus:border-forestDark rounded-2xl px-4 py-2.5 outline-none font-bold text-gray-700 shadow-cuteInner transition-all">
                    </div>

                    <!-- Date -->
                    <div>
                        <label for="recordDate" class="block text-sm font-bold text-forestDark mb-1">
                            紀錄日期 <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="recordDate" required
                            class="w-full bg-inputBg border-2 border-forestDark/40 focus:border-forestDark rounded-2xl px-4 py-2.5 outline-none font-bold text-gray-700 shadow-cuteInner transition-all">
                    </div>
                </div>

                <!-- Stage Selection Buttons -->
                <div>
                    <label class="block text-sm font-bold text-forestDark mb-2">
                        成長階段 <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="stageSelector">
                        <button type="button" onclick="selectStage('卵')" data-stage="卵" class="stage-btn active flex flex-col items-center justify-center p-2 rounded-2xl border-2 border-forestDark/30 bg-white font-bold transition-all text-xs sm:text-sm">
                            <span class="text-xl mb-1">🥚</span>
                            <span>卵</span>
                        </button>
                        <button type="button" onclick="selectStage('L1')" data-stage="L1" class="stage-btn flex flex-col items-center justify-center p-2 rounded-2xl border-2 border-forestDark/30 bg-white font-bold transition-all text-xs sm:text-sm">
                            <span class="text-xl mb-1">🐛</span>
                            <span>L1 一齡</span>
                        </button>
                        <button type="button" onclick="selectStage('L2')" data-stage="L2" class="stage-btn flex flex-col items-center justify-center p-2 rounded-2xl border-2 border-forestDark/30 bg-white font-bold transition-all text-xs sm:text-sm">
                            <span class="text-xl mb-1">🐛</span>
                            <span>L2 二齡</span>
                        </button>
                        <button type="button" onclick="selectStage('L3')" data-stage="L3" class="stage-btn flex flex-col items-center justify-center p-2 rounded-2xl border-2 border-forestDark/30 bg-white font-bold transition-all text-xs sm:text-sm">
                            <span class="text-xl mb-1">🐛</span>
                            <span>L3 三齡</span>
                        </button>
                        <button type="button" onclick="selectStage('蛹')" data-stage="蛹" class="stage-btn flex flex-col items-center justify-center p-2 rounded-2xl border-2 border-forestDark/30 bg-white font-bold transition-all text-xs sm:text-sm">
                            <span class="text-xl mb-1">🍃</span>
                            <span>蛹</span>
                        </button>
                        <button type="button" onclick="selectStage('成蟲')" data-stage="成蟲" class="stage-btn flex flex-col items-center justify-center p-2 rounded-2xl border-2 border-forestDark/30 bg-white font-bold transition-all text-xs sm:text-sm">
                            <span class="text-xl mb-1">🪲</span>
                            <span>成蟲</span>
                        </button>
                    </div>
                    <input type="hidden" id="selectedStage" value="卵">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Weight -->
                    <div>
                        <label for="beetleWeight" class="block text-sm font-bold text-forestDark mb-1">
                            體重 (克/g)
                        </label>
                        <div class="relative">
                            <input type="number" step="0.1" id="beetleWeight" placeholder="0.0" min="0" max="200"
                                class="w-full bg-inputBg border-2 border-forestDark/40 focus:border-forestDark rounded-2xl px-4 py-2.5 pr-12 outline-none font-bold text-gray-700 shadow-cuteInner transition-all">
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-gray-400">g</span>
                        </div>
                    </div>

                    <!-- Feed / Substrate -->
                    <div>
                        <label for="feedType" class="block text-sm font-bold text-forestDark mb-1">
                            介質 / 食材
                        </label>
                        <input type="text" id="feedType" placeholder="例如：高發酵木屑、甲蟲果蠅"
                            class="w-full bg-inputBg border-2 border-forestDark/40 focus:border-forestDark rounded-2xl px-4 py-2.5 outline-none font-bold text-gray-700 shadow-cuteInner transition-all">
                    </div>
                </div>

                <!-- Notes -->
                <div>
                    <label for="beetleNotes" class="block text-sm font-bold text-forestDark mb-1">
                        備註 / 狀態紀錄
                    </label>
                    <input type="text" id="beetleNotes" placeholder="例如：食慾良好、換土2/3、開始做蛹室"
                        class="w-full bg-inputBg border-2 border-forestDark/40 focus:border-forestDark rounded-2xl px-4 py-2.5 outline-none font-bold text-gray-700 shadow-cuteInner transition-all">
                </div>

                <!-- Action Buttons -->
                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                    <button type="submit" id="submitBtn" 
                        class="flex-1 bg-accentYellow hover:bg-accentYellowHover text-forestDark font-extrabold text-base py-3 px-6 rounded-2xl border-3 border-forestDark shadow-cute active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <span>新增紀錄</span> 🪲
                    </button>

                    <button type="button" id="cancelBtn" onclick="cancelEdit()" 
                        class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-base py-3 px-5 rounded-2xl border-3 border-forestDark shadow-cute active:translate-y-1 active:shadow-none transition-all cursor-pointer">
                        取消編輯
                    </button>
                </div>
            </form>
        </main>

        <!-- Storage & Backup Toolbar -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-cardBg/80 backdrop-blur-sm p-4 rounded-3xl border-3 border-forestDark shadow-cuteSm mb-6">
            <div class="flex items-center gap-2">
                <span class="text-xl">📁</span>
                <span class="font-bold text-forestDark text-sm">資料備份與管理</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportJSON()" class="bg-accentBlue hover:bg-accentBlueHover text-forestDark text-xs font-extrabold px-3.5 py-2 rounded-xl border-2 border-forestDark shadow-cuteSm active:translate-y-0.5 transition-all flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-download"></i>
                    <span>下載所有紀錄 (JSON)</span>
                </button>
                
                <label class="bg-accentOrange hover:bg-orange-200 text-forestDark text-xs font-extrabold px-3.5 py-2 rounded-xl border-2 border-forestDark shadow-cuteSm active:translate-y-0.5 transition-all flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-upload"></i>
                    <span>匯入紀錄</span>
                    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" class="hidden">
                </label>
            </div>
        </div>

        <!-- Records Card List Section -->
        <section>
            <div class="flex items-center justify-between mb-4 px-2">
                <h3 class="text-xl font-bold text-forestDark flex items-center gap-2">
                    <span>📋</span> 成長紀錄列表
                    <span id="recordCount" class="bg-forestDark text-white text-xs px-2.5 py-1 rounded-full font-bold">0 筆</span>
                </h3>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12 bg-cardBg/50 rounded-3xl border-3 border-dashed border-forestDark/30">
                <span class="text-5xl block mb-3">🍃</span>
                <p class="font-bold text-forestDark/70 text-lg">目前還沒有紀錄喔！</p>
                <p class="text-xs text-forestDark/60 mt-1">快在上方填寫第一個獨角仙成長日誌吧！</p>
            </div>

            <!-- Card Grid -->
            <div id="recordsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Cards will be populated here by JS -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center text-xs font-bold text-forestDark/60 mt-12 mb-4">
            獨角仙成長紀錄表 &copy; 2026 • 愛護甲蟲，快樂飼養 🌱
        </footer>
    </div>

    <script>
        // Default sample entries if none exist in localStorage
        const defaultRecords = [
            {
                id: 'RH-01',
                date: '2026-09-01',
                stage: 'L1',
                weight: '1.2',
                feed: '高發酵木屑',
                notes: '健康孵化，活力很好！'
            },
            {
                id: 'RH-01',
                date: '2026-09-20',
                stage: 'L2',
                weight: '6.8',
                feed: '二次發酵大夢土',
                notes: '順利轉齡為二齡幼蟲。'
            },
            {
                id: 'RH-02',
                date: '2026-09-20',
                stage: '卵',
                weight: '0.2',
                feed: '產房土',
                notes: '採卵成功，等待孵化中。'
            }
        ];

        let records = [];

        // Stage Configuration for Icons and Colors
        const stageConfig = {
            '卵': { icon: '🥚', bg: 'bg-tagEgg', border: 'border-yellow-600' },
            'L1': { icon: '🐛', bg: 'bg-tagLarva', border: 'border-green-600' },
            'L2': { icon: '🐛', bg: 'bg-tagLarva', border: 'border-green-600' },
            'L3': { icon: '🐛', bg: 'bg-tagLarva', border: 'border-green-700' },
            '蛹': { icon: '🍃', bg: 'bg-tagPupa', border: 'border-amber-700' },
            '成蟲': { icon: '🪲', bg: 'bg-tagAdult', border: 'border-blue-700' }
        };

        // Initialize Application
        window.onload = function() {
            // Set default date input to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('recordDate').value = today;

            // Load records from LocalStorage
            loadRecords();
        };

        // Select Stage Handler
        function selectStage(stageName) {
            document.getElementById('selectedStage').value = stageName;
            
            const buttons = document.querySelectorAll('.stage-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-stage') === stageName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Load Records
        function loadRecords() {
            const saved = localStorage.getItem('dynastinae_growth_records');
            if (saved) {
                try {
                    records = JSON.parse(saved);
                } catch(e) {
                    records = [...defaultRecords];
                }
            } else {
                records = [...defaultRecords];
                saveToLocalStorage();
            }
            renderRecords();
        }

        // Save Records to LocalStorage
        function saveToLocalStorage() {
            localStorage.setItem('dynastinae_growth_records', JSON.stringify(records));
        }

        // Render Card List
        function renderRecords() {
            const grid = document.getElementById('recordsGrid');
            const emptyState = document.getElementById('emptyState');
            const countBadge = document.getElementById('recordCount');

            countBadge.textContent = `${records.length} 筆`;

            if (records.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = '';

            records.forEach((item, index) => {
                const config = stageConfig[item.stage] || { icon: '🪲', bg: 'bg-tagAdult', border: 'border-gray-600' };
                
                const card = document.createElement('div');
                card.className = "bg-cardBg rounded-3xl border-3 border-forestDark p-4 shadow-cute transition-all hover:-translate-y-1 relative flex flex-col justify-between";

                card.innerHTML = `
                    <div>
                        <!-- Header Bar of Card -->
                        <div class="flex items-center justify-between pb-2 mb-3 border-b-2 border-dashed border-forestDark/20">
                            <div class="flex items-center gap-2">
                                <span class="${config.bg} text-forestDark font-black text-xs px-2.5 py-1 rounded-xl border-2 border-forestDark flex items-center gap-1">
                                    <span>${config.icon}</span> ${item.stage}
                                </span>
                                <span class="font-extrabold text-forestDark text-base">${escapeHtml(item.id)}</span>
                            </div>
                            <span class="text-xs font-bold text-gray-500 bg-white/60 px-2 py-1 rounded-lg border border-forestDark/20">
                                <i class="fa-regular fa-calendar-days mr-1"></i>${item.date}
                            </span>
                        </div>

                        <!-- Card Body Info -->
                        <div class="space-y-1.5 text-xs md:text-sm font-bold text-forestDark/90 mb-4 px-1">
                            <div class="flex items-center justify-between bg-white/80 p-2 rounded-xl border border-forestDark/10">
                                <span class="text-gray-500">體重 (Weight)</span>
                                <span class="text-sm font-black text-emerald-700">${item.weight ? item.weight + ' g' : '-'}</span>
                            </div>
                            
                            ${item.feed ? `
                            <div class="flex items-start gap-1 text-xs">
                                <span class="text-gray-400 shrink-0">介質:</span>
                                <span class="text-gray-700 font-bold">${escapeHtml(item.feed)}</span>
                            </div>` : ''}

                            ${item.notes ? `
                            <div class="flex items-start gap-1 text-xs">
                                <span class="text-gray-400 shrink-0">備註:</span>
                                <span class="text-gray-600">${escapeHtml(item.notes)}</span>
                            </div>` : ''}
                        </div>
                    </div>

                    <!-- Card Actions -->
                    <div class="flex items-center justify-end gap-2 pt-2 border-t border-forestDark/10">
                        <button onclick="editRecord(${index})" class="bg-accentBlue hover:bg-accentBlueHover text-forestDark font-bold text-xs px-3 py-1.5 rounded-xl border-2 border-forestDark shadow-cuteSm active:translate-y-0.5 transition-all cursor-pointer">
                            ✏️ 修改
                        </button>
                        <button onclick="deleteRecord(${index})" class="bg-accentRed hover:bg-accentRedHover text-forestDark font-bold text-xs px-3 py-1.5 rounded-xl border-2 border-forestDark shadow-cuteSm active:translate-y-0.5 transition-all cursor-pointer">
                            🗑️ 刪除
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Form Submit (Add or Update)
        function handleFormSubmit(event) {
            event.preventDefault();

            const id = document.getElementById('beetleId').value.trim();
            const date = document.getElementById('recordDate').value;
            const stage = document.getElementById('selectedStage').value;
            const weight = document.getElementById('beetleWeight').value;
            const feed = document.getElementById('feedType').value.trim();
            const notes = document.getElementById('beetleNotes').value.trim();
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!id || !date) {
                alert('請填寫編號/名稱與紀錄日期！');
                return;
            }

            const recordData = { id, date, stage, weight, feed, notes };

            if (editIndex >= 0 && editIndex < records.length) {
                // Update existing record
                records[editIndex] = recordData;
            } else {
                // Add new record at the top
                records.unshift(recordData);
            }

            saveToLocalStorage();
            renderRecords();
            resetForm();
        }

        // Edit Record
        function editRecord(index) {
            const record = records[index];
            if (!record) return;

            document.getElementById('editIndex').value = index;
            document.getElementById('beetleId').value = record.id;
            document.getElementById('recordDate').value = record.date;
            document.getElementById('beetleWeight').value = record.weight || '';
            document.getElementById('feedType').value = record.feed || '';
            document.getElementById('beetleNotes').value = record.notes || '';

            selectStage(record.stage || '卵');

            // UI Mode Adjustments
            document.getElementById('formTitle').innerHTML = '<span class="text-2xl">✏️</span> 修改成長紀錄';
            document.getElementById('editBadge').classList.remove('hidden');
            document.getElementById('submitBtn').innerHTML = '<span>更新紀錄</span> 💾';
            document.getElementById('cancelBtn').classList.remove('hidden');

            // Scroll up smoothly to form
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Cancel Edit Mode
        function cancelEdit() {
            resetForm();
        }

        // Reset Form to Add Mode
        function resetForm() {
            document.getElementById('growthForm').reset();
            document.getElementById('editIndex').value = "-1";
            
            // Set date back to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('recordDate').value = today;
            selectStage('卵');

            document.getElementById('formTitle').innerHTML = '<span class="text-2xl">🌱</span> 新增成長紀錄';
            document.getElementById('editBadge').classList.add('hidden');
            document.getElementById('submitBtn').innerHTML = '<span>新增紀錄</span> 🪲';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        // Delete Record
        function deleteRecord(index) {
            if (confirm(`確定要刪除這筆紀錄嗎？`)) {
                records.splice(index, 1);
                saveToLocalStorage();
                renderRecords();

                // If editing the item that was just deleted, reset form
                const editIndex = parseInt(document.getElementById('editIndex').value);
                if (editIndex === index) {
                    resetForm();
                }
            }
        }

        // Export JSON File
        function exportJSON() {
            if (records.length === 0) {
                alert('目前沒有任何紀錄可匯出喔！');
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            const today = new Date().toISOString().split('T')[0];
            
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `獨角仙成長紀錄_${today}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Import JSON File
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm(`匯入將會載入 ${importedData.length} 筆紀錄，是否確定匯入？`)) {
                            records = importedData;
                            saveToLocalStorage();
                            renderRecords();
                            alert('成功匯入紀錄！');
                        }
                    } else {
                        alert('JSON 檔案格式不正確（應為紀錄陣列）。');
                    }
                } catch (err) {
                    alert('讀取檔案失敗，請確認是否為有效的 JSON 檔案。');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset file input
        }

        // Helper to escape HTML to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
