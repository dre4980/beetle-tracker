<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獨角仙成長紀錄表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Zen Maru Gothic', sans-serif; }
  </style>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen p-4 max-w-md mx-auto pb-20">

  <!-- 標頭 -->
  <header class="text-center my-6">
    <h1 class="text-3xl font-bold text-amber-900 flex items-center justify-center gap-2">
      🪲 獨角仙成長紀錄
    </h1>
    <p class="text-xs text-amber-700 mt-1">雲端試算表同步版</p>
  </header>

  <!-- 新增資料表單 -->
  <section class="bg-white p-5 rounded-2xl shadow-sm border border-amber-200 mb-6">
    <h2 class="text-lg font-bold text-amber-800 mb-4 pb-2 border-b border-amber-100 flex items-center gap-2">
      📝 新增成長紀錄
    </h2>
    <form id="growthForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">個體編號 / 名稱</label>
        <input type="text" id="name" required placeholder="例如：RH-01" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">紀錄日期</label>
          <input type="date" id="date" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">成長階段</label>
          <select id="stage" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
            <option value="卵">🥚 卵</option>
            <option value="L1一齡">🐛 L1 一齡</option>
            <option value="L2二齡">🐛 L2 二齡</option>
            <option value="L3三齡" selected>🐛 L3 三齡</option>
            <option value="化蛹">💤 化蛹</option>
            <option value="成蟲">🪲 成蟲</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">體重 (g)</label>
          <input type="number" step="0.1" id="weight" placeholder="0.0" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">介質 / 食材</label>
          <input type="text" id="feed" placeholder="例如：高發酵木屑" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">備註說明</label>
        <input type="text" id="notes" placeholder="例如：健康良好、進行換土" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow hover:shadow-md active:scale-95 text-sm flex items-center justify-center gap-2">
        ➕ 新增並儲存至雲端
      </button>
    </form>
  </section>

  <!-- 紀錄列表區塊 -->
  <section>
    <div class="flex justify-between items-center mb-3 px-1">
      <h2 class="text-lg font-bold text-amber-900 flex items-center gap-2">
        📊 歷史成長紀錄
      </h2>
      <button onclick="fetchData()" class="text-xs bg-amber-200 text-amber-900 px-3 py-1.5 rounded-lg hover:bg-amber-300 font-bold transition">
        🔄 重新整理
      </button>
    </div>

    <div id="loading" class="text-center py-8 text-stone-400 text-sm">
      資料載入中...
    </div>

    <div id="recordList" class="space-y-3">
      <!-- 紀錄卡片會由 JavaScript 動態生成 -->
    </div>
  </section>

  <script>
    // 已自動加入你產生的 API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbwgRltW61Zqlpo9Ti64IRAIELIIQk8gmAXny2rLgQv0-pK9UzkFpRK4cHaOCfkpdVrl/exec";

    // 預設今日日期
    document.getElementById('date').valueAsDate = new Date();

    // 載入資料
    async function fetchData() {
      const loading = document.getElementById('loading');
      const recordList = document.getElementById('recordList');
      loading.classList.remove('hidden');
      recordList.innerHTML = '';

      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        loading.classList.add('hidden');

        if (!data || data.length === 0) {
          recordList.innerHTML = '<p class="text-center text-stone-400 text-sm py-6">目前還沒有任何紀錄喔！</p>';
          return;
        }

        // 反轉陣列，最新資料排前面
        data.reverse().forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-white p-4 rounded-xl border border-stone-200 shadow-sm space-y-2';
          
          let dateStr = item.date ? new Date(item.date).toLocaleDateString('zh-TW') : '無日期';

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="font-bold text-amber-900 text-base">${item.name || '未命名'}</span>
                <span class="text-xs text-stone-400 ml-2">${dateStr}</span>
              </div>
              <span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">
                ${item.stage || '未指定'}
              </span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs text-stone-600 bg-stone-50 p-2.5 rounded-lg mt-2">
              <div><strong>⚖️ 體重:</strong> ${item.weight ? item.weight + ' g' : '-'}</div>
              <div><strong>🍂 介質:</strong> ${item.feed || '-'}</div>
            </div>
            ${item.notes ? `<p class="text-xs text-stone-500 pt-1">📝 ${item.notes}</p>` : ''}
          `;
          recordList.appendChild(card);
        });
      } catch (error) {
        console.error('Error:', error);
        loading.innerText = '⚠️ 資料載入失敗，請確認 API 設定或稍後再試。';
      }
    }

    // 提交表單
    document.getElementById('growthForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '⏳ 正在傳送至試算表...';

      const payload = {
        name: document.getElementById('name').value,
        date: document.getElementById('date').value,
        stage: document.getElementById('stage').value,
        weight: document.getElementById('weight').value,
        feed: document.getElementById('feed').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('🎉 紀錄新增成功！');
        document.getElementById('growthForm').reset();
        document.getElementById('date').valueAsDate = new Date();
        
        // 延遲1.5秒刷新，確保 Google 試算表寫入完畢
        setTimeout(fetchData, 1500);
      } catch (error) {
        alert('❌ 發生錯誤，新增失敗！');
        console.error(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '➕ 新增並儲存至雲端';
      }
    });

    // 初始載入
    fetchData();
  </script>
</body>
</html>
