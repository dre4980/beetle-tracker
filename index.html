<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獨角仙成長紀錄表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #121826; color: #f3f4f6; }
  </style>
</head>
<body class="p-4 max-w-lg mx-auto pb-24">

  <!-- 標題區 -->
  <header class="text-center my-6">
    <h1 class="text-3xl font-bold text-amber-400 flex items-center justify-center gap-2">
      <span>🪲</span> 獨角仙成長紀錄表
    </h1>
    <p class="text-xs text-gray-400 mt-1">雲端自動同步至 Google 試算表</p>
  </header>

  <!-- 表單區 -->
  <section class="bg-gray-800/80 p-5 rounded-2xl shadow-xl border border-gray-700/50 mb-6 backdrop-blur">
    <h2 class="text-lg font-bold text-amber-300 mb-4 flex items-center gap-1">
      📝 新增紀錄
    </h2>
    <form id="growthForm" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-300 mb-1">個體編號 / 名稱 *</label>
        <input type="text" id="name" required placeholder="例：RH-01 或 獨角仙A" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-300 mb-1">紀錄日期 *</label>
          <input type="date" id="date" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs text-gray-300 mb-1">成長階段 *</label>
          <select id="stage" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
            <option value="卵">卵</option>
            <option value="L1 一齡">L1 一齡</option>
            <option value="L2 二齡">L2 二齡</option>
            <option value="L3 三齡">L3 三齡</option>
            <option value="前蛹">前蛹</option>
            <option value="化蛹">化蛹</option>
            <option value="羽化/成蟲">羽化/成蟲</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-300 mb-1">體重 (g)</label>
          <input type="number" step="0.1" id="weight" placeholder="例：28.5" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs text-gray-300 mb-1">介質 / 食材</label>
          <input type="text" id="feed" placeholder="例：高發酵木屑" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <div>
        <label class="block text-xs text-gray-300 mb-1">備註說明</label>
        <input type="text" id="notes" placeholder="例：狀態良好、剛換土" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 mt-2">
        <span>💾 儲存並同步至雲端</span>
      </button>
    </form>
  </section>

  <!-- 歷史紀錄卡片列表 -->
  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold text-gray-200">📋 成長紀錄列表</h2>
      <button onclick="fetchData()" class="text-xs text-amber-400 hover:underline flex items-center gap-1">
        🔄 重新整理
      </button>
    </div>

    <div id="loading" class="text-center py-8 text-gray-400 text-sm">
      資料載入中...
    </div>

    <div id="recordList" class="space-y-3"></div>
  </section>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbypzRHJdk23hTQi5aVc08wDCmsi2Ga2zInzObxDtKVpgVC2Pn5eaUaoZ-U4sHaUZ6Cb/exec";

    // 預設今日日期
    document.getElementById('date').valueAsDate = new Date();

    // 讀取資料
    async function fetchData() {
      const loading = document.getElementById('loading');
      const list = document.getElementById('recordList');
      loading.classList.remove('hidden');
      list.innerHTML = '';

      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        loading.classList.add('hidden');

        if (!data || data.length === 0) {
          list.innerHTML = '<div class="text-center py-6 text-gray-500 text-sm bg-gray-800/40 rounded-xl">目前尚無紀錄，新增第一筆吧！</div>';
          return;
        }

        // 倒序排列（最新在上）
        data.reverse().forEach(item => {
          const dateStr = item.date ? new Date(item.date).toISOString().split('T')[0] : '-';
          const card = document.createElement('div');
          card.className = 'bg-gray-800 p-4 rounded-xl border border-gray-700/60 shadow-md space-y-2';
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="font-bold text-amber-300 text-base">${item.name || '未命名'}</span>
                <span class="text-xs text-gray-400 ml-2">📅 ${dateStr}</span>
              </div>
              <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                ${item.stage || '未設定'}
              </span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs text-gray-300 pt-1 border-t border-gray-700/40">
              <div>⚖️ 體重: <span class="text-white font-medium">${item.weight ? item.weight + ' g' : '-'}</span></div>
              <div>🪵 介質: <span class="text-white font-medium">${item.feed || '-'}</span></div>
            </div>
            ${item.notes ? `<div class="text-xs text-gray-400 bg-gray-900/50 p-2 rounded-lg mt-1">💬 ${item.notes}</div>` : ''}
          `;
          list.appendChild(card);
        });
      } catch (err) {
        loading.innerHTML = '<span class="text-rose-400">無法讀取資料，請確認網路連線。</span>';
        console.error(err);
      }
    }

    // 新增資料
    document.getElementById('growthForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '儲存中...';

      const payload = {
        action: 'add',
        id: Date.now().toString(),
        name: document.getElementById('name').value,
        date: document.getElementById('date').value,
        stage: document.getElementById('stage').value,
        weight: document.getElementById('weight').value,
        feed: document.getElementById('feed').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('成功新增紀錄！');
        document.getElementById('growthForm').reset();
        document.getElementById('date').valueAsDate = new Date();
        setTimeout(fetchData, 1000);
      } catch (err) {
        alert('儲存失敗，請重試');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 儲存並同步至雲端';
      }
    });

    // 頁面載入時讀取
    fetchData();
  </script>
</body>
</html>
